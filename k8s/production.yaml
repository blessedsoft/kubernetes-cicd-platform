apiVersion: v1
kind: Namespace
metadata: {name: production}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: sec-project, namespace: production}
spec:
  replicas: 3
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector: {matchLabels: {app: sec-project}}
  template:
    metadata: {labels: {app: sec-project}}
    spec:
      containers:
        - name: app
          image: IMAGE_PLACEHOLDER
          ports: [{containerPort: 8080}]
          readinessProbe: {httpGet: {path: /healthz, port: 8080}, initialDelaySeconds: 3}
          livenessProbe: {httpGet: {path: /healthz, port: 8080}, initialDelaySeconds: 10}
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 250m, memory: 128Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: sec-project, namespace: production}
spec:
  selector: {app: sec-project}
  ports: [{port: 80, targetPort: 8080}]
